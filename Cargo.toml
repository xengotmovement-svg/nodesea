[package]
name = "nodesea"
version = "0.1.0"
edition = "2024"
description = "Pure Rust Node.js Single Executable Application (SEA) builder"
license = "MIT"

[dependencies]
goblin = "0.9"
scroll = "0.12"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
anyhow = "1"
thiserror = "2"
bitflags = "2"
which = "7"
ureq = "3"
flate2 = "1"
tar = "0.4"
rolldown = { path = "../rolldown/crates/rolldown" }
rolldown_common = { path = "../rolldown/crates/rolldown_common" }
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3"
