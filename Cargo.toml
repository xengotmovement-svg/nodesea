[package]
name = "nodesea"
version = "0.0.0"
edition = "2024"
description = "Pure Rust Node.js Single Executable Application (SEA) builder"
license = "MIT"
repository = "https://github.com/Dunqing/nodesea"
readme = "README.md"
keywords = ["nodejs", "sea", "executable", "single-executable"]
categories = ["development-tools", "command-line-utilities"]
publish = false  # Distributed as binary via GitHub Releases

[dependencies]
goblin = "0.9"
scroll = "0.12"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
anyhow = "1"
thiserror = "2"
bitflags = "2"
which = "7"
ureq = "3"
flate2 = "1"
tar = "0.4"
rolldown = { git = "https://github.com/rolldown/rolldown.git", rev = "1ee3871" }
rolldown_common = { git = "https://github.com/rolldown/rolldown.git", rev = "1ee3871" }
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3"
